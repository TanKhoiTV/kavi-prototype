name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install uv
        uses: astral-sh/setup-uv@v8
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: make check (ruff lint + format)
        run: make check
