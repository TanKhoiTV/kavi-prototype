[project]
name = "prototype"
version = "0.1.0"
description = "OneVoice AI Challenge - ASR->MT->TTS prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    "transformers",
    "soundfile",
    "torch",
    "torchaudio",
    "sentencepiece>=0.2.1",
    "jiwer>=4.0.0",
    "sacrebleu>=2.6.0",
]

[tool.uv]
# Use CPU-only PyTorch (no CUDA on this machine)
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
