[project]
name = "prototype"
version = "0.1.0"
description = "OneVoice AI Challenge - ASR->MT->TTS prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper",
  "transformers",
  "soundfile",
  "torch",
  "torchaudio",
  "sentencepiece>=0.2.1",
  "jiwer>=4.0.0",
  "sacrebleu>=2.6.0",
  "piper-tts>=1.4.2",
  "silero-vad>=5.1.0",
  "noisereduce>=3.0",
]

[tool.uv]
# Use CPU-only PyTorch (no CUDA on this machine)
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Archived legacy code (pre-restructure) is intentionally not linted.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = ["pre-commit>=4.6.0", "ruff>=0.15.18", "datasets"]
